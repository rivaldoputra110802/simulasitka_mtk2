        // ---------------------------------------------------------
        // 3. LOGIKA APLIKASI (AMAN REFRESH & TIMER)
        // ---------------------------------------------------------
        let timerSiswa = null;
        let currentIndex = 0;
        let jawabanSiswa = []; 
        let ujianSelesai = false; 
        let namaSiswaAktif = ""; 

        // AUTO-LOGIN JIKA SEBELUMNYA REFRESH
        window.onload = function() {
            if (localStorage.getItem('nama_mtk_acak_aktif')) {
                const savedIndex = localStorage.getItem('index_mtk_acak_aktif');
                if (savedIndex) currentIndex = parseInt(savedIndex);
                masukSiswa(true);
            }
        };

        // FUNGSI GURU
        function bukaModalGuru() { document.getElementById('modal-guru').classList.remove('hidden'); }
        function tutupModalGuru() { document.getElementById('modal-guru').classList.add('hidden'); document.getElementById('input-sandi-guru').value = ''; }
        
        function prosesMasukGuru() {
            const sandi = document.getElementById('input-sandi-guru').value;
            if (sandi === 'ALDO123') {
                tutupModalGuru();
                document.getElementById('layar-login').classList.add('hidden');
                document.getElementById('guru-page').classList.remove('hidden');
                muatDaftarNilaiGuru();
            } else {
                alert("Sandi salah! Silakan coba lagi.");
            }
        }

        function muatDaftarNilaiGuru() {
            db.ref('tka_mtk/hasil').on('value', (snapshot) => {
                const data = snapshot.val();
                const tabel = document.getElementById('tabel-hasil-siswa');
                tabel.innerHTML = '';
                
                if (data) {
                    let nomor = 1;
                    for (const key in data) {
                        const item = data[key];
                        const listSalah = item.salah || '-';
                        tabel.innerHTML += `
                            <tr class="hover:bg-gray-50 border-b">
                                <td class="p-3 text-center font-bold text-gray-500">${nomor++}</td>
                                <td class="p-3 text-gray-800 font-bold">${item.nama}</td>
                                <td class="p-3 text-center text-gray-600">${item.benar} / ${paketSoalTKA.length}</td>
                                <td class="p-3 text-center font-black text-blue-600 text-lg">${item.nilai}</td>
                                <td class="p-3 text-sm font-semibold text-red-500 max-w-xs break-words">${listSalah}</td>
                            </tr>
                        `;
                    }
                } else {
                    tabel.innerHTML = `<tr><td colspan="5" class="text-center p-4 text-gray-400">Belum ada nilai yang masuk.</td></tr>`;
                }
            });
        }

        function kembaliKeLoginDariGuru() {
            document.getElementById('guru-page').classList.add('hidden');
            document.getElementById('layar-login').classList.remove('hidden');
        }

        function resetDatabaseGuru() {
            if (confirm("Yakin ingin menghapus semua nilai siswa dari database?")) {
                db.ref('tka_mtk/hasil').set(null).then(() => { alert("Tabel nilai berhasil dikosongkan!"); });
            }
        }

        // FUNGSI SISWA
        function mulaiUjian() {
            masukSiswa(false);
        }

        function masukSiswa(isAuto = false) {
            if (!isAuto) {
                namaSiswaAktif = document.getElementById('input-nama').value.trim();
                if(!namaSiswaAktif) { alert("Namamu belum diisi, ayo isi dulu!"); return; }
                localStorage.setItem('nama_mtk_acak_aktif', namaSiswaAktif); 
                currentIndex = 0;
            } else {
                namaSiswaAktif = localStorage.getItem('nama_mtk_acak_aktif');
            }

            const savedJawaban = localStorage.getItem('jawaban_mtk_acak_' + namaSiswaAktif);
            if (savedJawaban) {
                jawabanSiswa = JSON.parse(savedJawaban);
            } else {
                jawabanSiswa = Array.from({length: paketSoalTKA.length}, () => []);
            }
            
            ujianSelesai = false;
            
            document.getElementById('layar-login').classList.add('hidden');
            document.getElementById('area-ujian').classList.remove('hidden');
            document.getElementById('header-nama-siswa').innerText = namaSiswaAktif;
            
            renderSoal(currentIndex);
            if(!timerSiswa) { mulaiTimerLokal(120); } // 2 Jam
        }

        function mulaiTimerLokal(menit) {
            let endTimeSiswa = localStorage.getItem('endtime_mtk_acak_' + namaSiswaAktif);
            
            if (!endTimeSiswa) {
                endTimeSiswa = Date.now() + (menit * 60 * 1000);
                localStorage.setItem('endtime_mtk_acak_' + namaSiswaAktif, endTimeSiswa);
            } else {
                endTimeSiswa = parseInt(endTimeSiswa);
            }

            const timerElemen = document.getElementById('timer-display');
            clearInterval(timerSiswa);
            
            timerSiswa = setInterval(() => {
                const sisa = endTimeSiswa - Date.now();
                if (sisa <= 0) {
                    clearInterval(timerSiswa);
                    timerElemen.innerText = "00:00:00";
                    if(!ujianSelesai) {
                        alert("Waktu Habis! Jawabanmu otomatis dikumpulkan.");
                        kumpulkanJawaban(true);
                    }
                } else {
                    const totalDetik = Math.floor(sisa / 1000);
                    const jam = Math.floor(totalDetik / 3600);
                    const mnt = Math.floor((totalDetik % 3600) / 60);
                    const dtk = totalDetik % 60;
                    
                    let formatWaktu = `${jam.toString().padStart(2, '0')}:${mnt.toString().padStart(2, '0')}:${dtk.toString().padStart(2, '0')}`;
                    timerElemen.innerText = formatWaktu;

                    if (totalDetik <= 180) { timerElemen.classList.add('waktu-habis'); } 
                    else { timerElemen.classList.remove('waktu-habis'); }
                }
            }, 1000);
        }

        function gantiSoal(arah) { 
            simpanJawabanSaatIni(); 
            const newIndex = currentIndex + arah;
            if (newIndex >= 0 && newIndex < paketSoalTKA.length) {
                currentIndex = newIndex;
                renderSoal(currentIndex);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function simpanJawabanSaatIni() {
            const container = document.getElementById('wadah-pilihan');
            const inputs = container.querySelectorAll('input:checked');
            
            jawabanSiswa[currentIndex] = Array.from(inputs).map(el => {
                return el.value.includes('_') ? el.value : parseInt(el.value);
            });
            
            if (namaSiswaAktif) {
                localStorage.setItem('jawaban_mtk_acak_' + namaSiswaAktif, JSON.stringify(jawabanSiswa));
                localStorage.setItem('index_mtk_acak_aktif', currentIndex);
            }
        }

        function renderSoal(indeks) {
            const s = paketSoalTKA[indeks];
            document.getElementById('nomor-soal-display').innerText = `${indeks + 1}/${paketSoalTKA.length}`;
            
            const wadahWacana = document.getElementById('konten-wacana');
            if (s.wacana) { 
                wadahWacana.classList.remove('hidden'); 
                wadahWacana.innerHTML = s.wacana; 
            } else { 
                wadahWacana.classList.add('hidden'); 
            }
            
            document.getElementById('konten-pertanyaan').innerHTML = s.pertanyaan;
            const containerPilihan = document.getElementById('wadah-pilihan');
            containerPilihan.innerHTML = '';
            
            const savedAns = jawabanSiswa[indeks] || []; 

            if (s.tipe === 'Benar Salah') {
                let htmlTable = `
                    <div class="overflow-hidden border border-blue-300 rounded-xl mb-2 shadow-sm">
                    <table class="w-full text-sm text-left" style="border:none;">
                        <thead class="bg-blue-100 text-blue-900 font-bold" style="border-bottom: 2px solid #93c5fd;">
                            <tr>
                                <th class="p-3" style="border:none;">Pernyataan</th>
                                <th class="p-3 text-center w-16" style="border:none;">Benar</th>
                                <th class="p-3 text-center w-16" style="border:none;">Salah</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white">
                `;
                s.pilihan.forEach((pil, i) => {
                    const valB = i + "_B";
                    const valS = i + "_S";
                    const isCheckedB = savedAns.includes(valB) ? "checked" : "";
                    const isCheckedS = savedAns.includes(valS) ? "checked" : "";
                    
                    htmlTable += `
                        <tr class="hover:bg-blue-50 transition" style="border-bottom: 1px solid #e5e7eb;">
                            <td class="p-3 text-gray-700 leading-snug" style="border:none;">${pil}</td>
                            <td class="p-3 text-center align-middle" style="border:none; border-left: 1px solid #e5e7eb;">
                                <input type="radio" name="bs_${i}" value="${valB}" ${isCheckedB} onchange="simpanJawabanSaatIni()" class="w-5 h-5 accent-blue-600 cursor-pointer">
                            </td>
                            <td class="p-3 text-center align-middle" style="border:none; border-left: 1px solid #e5e7eb;">
                                <input type="radio" name="bs_${i}" value="${valS}" ${isCheckedS} onchange="simpanJawabanSaatIni()" class="w-5 h-5 accent-blue-600 cursor-pointer">
                            </td>
                        </tr>
                    `;
                });
                htmlTable += `</tbody></table></div>`;
                containerPilihan.innerHTML = htmlTable;
            } else {
                const type = s.tipe === 'Ganda Kompleks' ? 'checkbox' : 'radio';
                s.pilihan.forEach((pil, i) => {
                    const isChecked = savedAns.includes(i) ? "checked" : "";
                    containerPilihan.innerHTML += `
                        <label class="flex items-center gap-3 p-3 bg-white border border-gray-300 rounded-lg mb-2 cursor-pointer hover:bg-blue-50 active:bg-blue-100 transition shadow-sm">
                            <input type="${type}" name="jawaban" value="${i}" ${isChecked} onchange="simpanJawabanSaatIni()" class="w-5 h-5 text-blue-600">
                            <span class="text-gray-800 font-medium text-sm md:text-base leading-snug w-full">${pil}</span>
                        </label>
                    `;
                });
            }

            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            const btnSelesai = document.getElementById('btn-selesai');

            if (indeks === 0) {
                btnPrev.classList.add('hidden');
            } else {
                btnPrev.classList.remove('hidden');
            }

            if (indeks === paketSoalTKA.length - 1) {
                btnNext.classList.add('hidden');
                btnSelesai.classList.remove('hidden');
            } else {
                btnNext.classList.remove('hidden');
                btnSelesai.classList.add('hidden');
            }
        }

        function kumpulkanJawaban(autoSubmit) {
            simpanJawabanSaatIni();
            
            if (!autoSubmit) {
                let totalTerjawab = jawabanSiswa.filter(ans => ans && ans.length > 0).length;
                if (totalTerjawab < paketSoalTKA.length) {
                    if (!confirm(`Ada ${paketSoalTKA.length - totalTerjawab} soal belum dijawab. Yakin selesai?`)) return;
                } else {
                    if (!confirm(`Semua soal telah terjawab. Kumpulkan sekarang?`)) return;
                }
            }

            ujianSelesai = true;
            clearInterval(timerSiswa);
            document.getElementById('area-ujian').classList.add('hidden');
            document.getElementById('layar-hasil').classList.remove('hidden');

            let benar = 0;
            let soalSalah = [];
            const total = paketSoalTKA.length;

            paketSoalTKA.forEach((soal, i) => {
                const jawab = jawabanSiswa[i] || [];
                const kunci = soal.kunci || [];

                let isBenar = false;
                if (jawab.length === kunci.length && kunci.every(val => jawab.includes(val))) {
                    benar++;
                    isBenar = true;
                }

                if (!isBenar) {
                    soalSalah.push(i + 1); // Simpan nomor soal (mulai dari 1)
                }
            });

            const nilaiAkhir = Math.round((benar / total) * 100);
            const teksSalah = soalSalah.length > 0 ? soalSalah.join(', ') : '-';
            
            document.getElementById('nama-hasil').innerText = namaSiswaAktif;
            document.getElementById('skor-akhir').innerText = nilaiAkhir;
            document.getElementById('detail-benar-akhir').innerText = `Benar ${benar} dari ${total} soal`;

            // SIMPAN KE FIREBASE
            const keyAman = namaSiswaAktif.replace(/[.#$\[\]\/]/g, '_');
            db.ref('tka_mtk/hasil/' + keyAman).set({
                nama: namaSiswaAktif,
                benar: benar,
                nilai: nilaiAkhir,
                salah: teksSalah
            });

            // Hapus Sesi Ujian di LocalStorage agar perangkat bisa dipakai anak lain
            localStorage.removeItem('nama_mtk_acak_aktif');
            localStorage.removeItem('jawaban_mtk_acak_' + namaSiswaAktif);
            localStorage.removeItem('index_mtk_acak_aktif');
            localStorage.removeItem('endtime_mtk_acak_' + namaSiswaAktif);
        }

        function keluarKeAwal() {
            location.reload();
        }
    </script>
